name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to retry
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify:
    name: Verify release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: npm/app/package-lock.json
      - name: Verify version invariant
        shell: bash
        run: |
          VERSION='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          node scripts/verify-version.mjs "${VERSION#v}"
      - name: Verify Rust
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings
      - name: Verify npm wrapper
        working-directory: npm/app
        run: |
          npm ci
          npm run build
          npm pack --dry-run

  build-platform:
    name: Build ${{ matrix.node_pkg }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, node_os: linux, node_arch: x64, node_pkg: courseape-linux-x64, smoke: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, node_os: linux, node_arch: arm64, node_pkg: courseape-linux-arm64, use_cross: true }
          - { os: macos-latest, target: x86_64-apple-darwin, node_os: darwin, node_arch: x64, node_pkg: courseape-darwin-x64 }
          - { os: macos-latest, target: aarch64-apple-darwin, node_os: darwin, node_arch: arm64, node_pkg: courseape-darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, node_os: win32, node_arch: x64, node_pkg: courseape-win32-x64, smoke: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, node_os: win32, node_arch: arm64, node_pkg: courseape-win32-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke-test native binary version
        if: matrix.smoke
        shell: bash
        run: |
          VERSION='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          VERSION="${VERSION#v}"
          EXT=''
          [[ '${{ matrix.node_os }}' == 'win32' ]] && EXT='.exe'
          "target/${{ matrix.target }}/release/courseape${EXT}" --version | grep "$VERSION"
      - name: Prepare package and release files
        shell: bash
        run: |
          VERSION='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          VERSION="${VERSION#v}"
          EXT=''
          [[ '${{ matrix.node_os }}' == 'win32' ]] && EXT='.exe'
          BINARY="target/${{ matrix.target }}/release/courseape${EXT}"
          PACKAGE="npm/${{ matrix.node_pkg }}"
          mkdir -p out/packages out/release
          node scripts/package-platform.mjs "$VERSION" '${{ matrix.node_os }}' '${{ matrix.node_arch }}' "$BINARY" "$PACKAGE"
          [[ '${{ matrix.node_os }}' == 'win32' ]] || chmod +x "$PACKAGE/bin/courseape"
          npm pack "./$PACKAGE" --pack-destination out/packages
          RELEASE="courseape-${{ matrix.node_os }}-${{ matrix.node_arch }}${EXT}"
          cp "$BINARY" "out/release/${RELEASE}"
          (
            cd out/release
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$RELEASE" > "${RELEASE}.sha256"
            else
              shasum -a 256 "$RELEASE" > "${RELEASE}.sha256"
            fi
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.node_pkg }}
          path: out

  package-base:
    name: Package base npm wrapper
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - working-directory: npm/app
        run: |
          cp ../../README.md README.md
          cp ../../LICENSE LICENSE
          npm ci
          npm run build
          mkdir -p ../../out/packages
          npm pack --pack-destination ../../out/packages
      - uses: actions/upload-artifact@v4
        with:
          name: courseape-base
          path: out

  publish:
    name: Publish npm and GitHub Release
    needs: [build-platform, package-base]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish platform packages then base wrapper
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          VERSION="${VERSION#v}"
          for PLATFORM in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            mapfile -t PACKAGES < <(find dist/packages -type f -name "*courseape-${PLATFORM}-${VERSION}.tgz")
            [[ ${#PACKAGES[@]} -eq 1 ]] || { echo "Expected one ${PLATFORM} package, found ${#PACKAGES[@]}" >&2; exit 1; }
            PKG="./${PACKAGES[0]#./}"
            if npm view "@dyliu0306/courseape-${PLATFORM}@${VERSION}" version >/dev/null 2>&1; then
              echo "@dyliu0306/courseape-${PLATFORM}@${VERSION} already published; skipping"
            else
              npm publish "$PKG" --access public
            fi
          done
          mapfile -t BASE_PACKAGES < <(find dist/packages -type f -name "dyliu0306-courseape-${VERSION}.tgz")
          [[ ${#BASE_PACKAGES[@]} -eq 1 ]] || { echo "Expected one base package, found ${#BASE_PACKAGES[@]}" >&2; exit 1; }
          BASE="./${BASE_PACKAGES[0]#./}"
          if npm view "@dyliu0306/courseape@${VERSION}" version >/dev/null 2>&1; then
            echo "@dyliu0306/courseape@${VERSION} already published; skipping"
          else
            npm publish "$BASE" --access public
          fi
          for ATTEMPT in {1..12}; do
            if npm view "@dyliu0306/courseape@${VERSION}" version; then
              break
            fi
            [[ $ATTEMPT -lt 12 ]] || exit 1
            sleep 5
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: dist/release/*
          generate_release_notes: true
